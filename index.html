<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Drag & Drop File Uploader</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <main class="app">

        <section class="uploader-card">

            <div class="header">
                <span class="badge">FILE UPLOADER</span>

                <h1>Upload Your Image</h1>

                <p>
                    Drag and drop an image or browse your device
                </p>
            </div>

            <div id="drop-zone" class="drop-zone">

                <div class="upload-icon">
                    ↑
                </div>

                <h2>Drag & Drop your image</h2>

                <p>JPG, PNG or GIF</p>

                <span class="or">or</span>

                <label for="file-input" class="browse-btn">
                    Browse Files
                </label>

                <input
                    type="file"
                    id="file-input"
                    accept=".jpg,.jpeg,.png,.gif"
                    hidden>

            </div>

            <p id="error-message" class="error-message"></p>

            <div id="preview-container" class="preview-container">

                <div class="preview-image">
                    <img id="preview" src="" alt="Uploaded image">
                </div>

           <div class="file-details">

    <h3 id="file-name">File Name</h3>

    <p id="file-size">0 MB</p>

    <button id="remove-btn" type="button">
        Remove
    </button>

        </div>

            </div>

            <div id="progress-container" class="progress-container">

                <div class="progress-header">

                    <span id="upload-status">
                        Uploading...
                    </span>

                    <span id="progress-percent">
                        0%
                    </span>

                </div>

                <div class="progress-track">

                    <div id="progress" class="progress-bar"></div>

                </div>

            </div>

        </section>

        <footer>
            <span>Secure local preview</span>
            <span>•</span>
            <span>Images only</span>
        </footer>

    </main>

    <script src="script.js"></script>

</body>

</html>
